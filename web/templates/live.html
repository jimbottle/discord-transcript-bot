{% extends "base.html" %}
{% block title %}Live Session - Transcript Bot{% endblock %}
{% block content %}
<hgroup>
    <h1>Live Session</h1>
    <p id="session-meta">Loading…</p>
</hgroup>

<article>
    <header>
        <span id="live-badge" class="live-badge live-off">idle</span>
        <span id="updated" class="search-meta"></span>
    </header>
    <div id="live-feed" class="transcript-content" aria-live="polite">
        <p id="empty-state">No session transcript yet.</p>
    </div>
</article>
{% endblock %}

{% block scripts %}
<script>
const DATA_URL = "{{ url_for('live_data') }}";
const POLL_MS = 3000;

let lastFetchAt = 0;
let lastAge = null;

function fmtAge(sec) {
    if (sec == null) return "";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + "s ago";
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + "m " + s + "s ago";
}

function tickUpdatedLabel() {
    // Advance the "updated Ns ago" label between polls without refetching.
    if (lastAge == null) return;
    const extra = (Date.now() - lastFetchAt) / 1000;
    document.getElementById("updated").textContent =
        "last write " + fmtAge(lastAge + extra);
}

// How many entries are already in the DOM, and for which session file.
// Append-only rendering: we never tear down existing nodes, so a user
// who scrolled up to re-read keeps their position, text selection is
// preserved, and a screen reader (aria-live) only announces NEW lines —
// not the whole transcript every poll.
let renderedCount = 0;
let renderedFile = null;

function buildEntry(e) {
    // createElement + textContent: transcript text is raw user speech
    // and must never be parsed as HTML.
    const entry = document.createElement("div");
    entry.className = "entry";

    let who = "";
    if (e.player) {
        who = e.player;
        if (e.character && e.character !== e.player) who += " (" + e.character + ")";
    }
    if (who || e.time) {
        const head = document.createElement("div");
        head.className = "entry-meta";
        const whoSpan = document.createElement("strong");
        whoSpan.textContent = who || "Unknown";
        head.appendChild(whoSpan);
        if (e.time) head.appendChild(document.createTextNode(" · " + e.time));
        entry.appendChild(head);
    }

    const body = document.createElement("div");
    body.className = "entry-text";
    body.textContent = e.text;
    entry.appendChild(body);
    return entry;
}

function render(data) {
    const badge = document.getElementById("live-badge");
    const meta = document.getElementById("session-meta");
    const feed = document.getElementById("live-feed");

    if (data.live) {
        badge.textContent = "● LIVE";
        badge.className = "live-badge live-on";
    } else {
        badge.textContent = "idle";
        badge.className = "live-badge live-off";
    }

    meta.textContent = data.filename
        ? "session: " + data.filename + " · " + data.entries.length + " entries"
        : "No active session.";

    lastAge = data.age_seconds;
    lastFetchAt = Date.now();
    tickUpdatedLabel();

    const entries = data.entries || [];

    // Full reset only when the session changed or the file shrank
    // (new session / rotated / truncated) — otherwise it grows.
    const reset =
        data.filename !== renderedFile || entries.length < renderedCount;
    if (reset) {
        while (feed.firstChild) feed.removeChild(feed.firstChild);
        renderedCount = 0;
        renderedFile = data.filename;
    }

    if (entries.length === 0) {
        if (feed.childElementCount === 0) {
            const p = document.createElement("p");
            p.textContent = data.filename
                ? "Session file is empty so far."
                : "No session transcript yet.";
            feed.appendChild(p);
        }
        return;
    }
    if (reset) {
        const empty = document.getElementById("empty-state");
        if (empty) empty.remove();
    }

    if (entries.length === renderedCount) return;  // nothing new

    // Measure BEFORE appending; only auto-scroll if already at the
    // bottom (or this is a fresh session). Otherwise leave scrollTop
    // untouched so re-reading earlier lines isn't disrupted.
    const stick =
        reset ||
        feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;

    const frag = document.createDocumentFragment();
    for (let i = renderedCount; i < entries.length; i++) {
        frag.appendChild(buildEntry(entries[i]));
    }
    feed.appendChild(frag);
    renderedCount = entries.length;

    if (stick) feed.scrollTop = feed.scrollHeight;
}

async function poll() {
    try {
        const res = await fetch(DATA_URL);
        if (res.ok) render(await res.json());
    } catch (e) {
        console.error("Live poll error:", e);
    }
}

poll();
setInterval(poll, POLL_MS);
setInterval(tickUpdatedLabel, 1000);
</script>
{% endblock %}
