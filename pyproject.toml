[project]
name = "discord-transcript-bot"
version = "1.0.0"
description = "A Discord bot that records voice sessions, transcribes them, and answers questions about them"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies mirror requirements.txt, which the Dockerfile still
# installs from; keep the two in step until the image moves to uv.
dependencies = [
    "py-cord[voice] @ git+https://github.com/Pycord-Development/pycord@fix/voice-rec-2",
    "python-dotenv",
    "pyyaml",
    "faster_whisper",
    "openai",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scipy; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "anthropic>=1.16",
    "torch",
    "reportlab",
    "flask",
]

[dependency-groups]
dev = [
    "pytest",
    # tests/test_llm_local.py imports httpx directly (the SDKs pull it in at runtime).
    "httpx",
]

# torch from the CPU index (requirements.txt's --extra-index-url); explicit so no
# other package resolves from it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
# black's defaults, which the code already follows (CLAUDE.md "Code Style").
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# The classic default set, named explicitly so a ruff upgrade cannot widen it;
# E741 (single-letter names) is style-only and predates ruff here.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules live at the repo root (main.py, src/, web/); `uv run pytest` does
# not add the cwd the way `python -m pytest` did.
pythonpath = ["."]
markers = [
    "integration: hits real services (Discord gateway, network); auto-skipped without credentials",
]
