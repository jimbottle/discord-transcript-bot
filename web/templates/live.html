{% extends "base.html" %}
{% block title %}Live Session - Transcript Bot{% endblock %}
{% block content %}
<hgroup>
    <h1>Live Session</h1>
    <p id="session-meta">Loading…</p>
</hgroup>

{% with ask_static=False %}{% include "_ask.html" %}{% endwith %}

<article>
    <header>
        <span id="live-badge" class="live-badge live-off">idle</span>
        <span id="updated" class="search-meta"></span>
    </header>
    <div id="live-feed" class="transcript-content" aria-live="polite">
        <p id="empty-state">No session transcript yet.</p>
    </div>
</article>

{% endblock %}

{% block scripts %}
<script>
const DATA_URL = "{{ url_for('live_data') }}";
const POLL_MS = 3000;

let lastFetchAt = 0;
let lastAge = null;

function fmtAge(sec) {
    if (sec == null) return "";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + "s ago";
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + "m " + s + "s ago";
}

function tickUpdatedLabel() {
    // Advance the "updated Ns ago" label between polls without refetching.
    if (lastAge == null) return;
    const extra = (Date.now() - lastFetchAt) / 1000;
    document.getElementById("updated").textContent =
        "last write " + fmtAge(lastAge + extra);
}

// How many entries are already in the DOM, and for which session file.
// Newest-first, prepend-only rendering: the latest line is always at the
// top of the feed, and we never tear down existing nodes, so a user who
// scrolled down to re-read keeps their place, text selection is
// preserved, and a screen reader (aria-live) only announces NEW lines —
// not the whole transcript every poll.
let renderedCount = 0;
let renderedFile = null;

// "20:26:09" -> "8:26 PM" (same rule as src/utils/timefmt.clock).
function clock12(hms) {
    const m = /^(\d{1,2}):(\d{2})/.exec(hms || "");
    if (!m) return hms;
    const h = +m[1];
    return (h % 12 || 12) + ":" + m[2] + (h < 12 ? " AM" : " PM");
}

function buildEntry(e) {
    // createElement + textContent: transcript text is raw user speech
    // and must never be parsed as HTML.
    const entry = document.createElement("div");
    entry.className = "entry";

    let who = "";
    if (e.player) {
        who = e.player;
        if (e.character && e.character !== e.player) who += " (" + e.character + ")";
    }
    if (who || e.time) {
        const head = document.createElement("div");
        head.className = "entry-meta";
        const whoSpan = document.createElement("strong");
        whoSpan.textContent = who || "Unknown";
        head.appendChild(whoSpan);
        if (e.time) head.appendChild(document.createTextNode(" · " + clock12(e.time)));
        entry.appendChild(head);
    }

    const body = document.createElement("div");
    body.className = "entry-text";
    body.textContent = e.text;
    entry.appendChild(body);
    return entry;
}

function render(data) {
    const badge = document.getElementById("live-badge");
    const meta = document.getElementById("session-meta");
    const feed = document.getElementById("live-feed");

    if (data.live) {
        badge.textContent = "● LIVE";
        badge.className = "live-badge live-on";
    } else {
        badge.textContent = "idle";
        badge.className = "live-badge live-off";
    }

    const s = data.session || {};
    if (!data.filename) {
        meta.textContent = "No active session.";
    } else if (s.tagged && s.campaign) {
        meta.textContent = [s.game, s.campaign, s.group, "session " + s.session_day]
            .filter(Boolean).join(" · ")
            + (s.recordings > 1 ? " · " + s.recordings + " recordings" : "")
            + " · " + data.entries.length + " entries in " + data.filename;
    } else {
        meta.textContent = "untagged recording " + data.filename + " · "
            + data.entries.length + " entries";
    }

    lastAge = data.age_seconds;
    lastFetchAt = Date.now();
    tickUpdatedLabel();
    updateAskAvailability(data);

    const entries = data.entries || [];

    // Full reset only when the session changed or the file shrank
    // (new session / rotated / truncated) — otherwise it grows.
    const reset =
        data.filename !== renderedFile || entries.length < renderedCount;
    if (reset) {
        while (feed.firstChild) feed.removeChild(feed.firstChild);
        renderedCount = 0;
        renderedFile = data.filename;
    }

    if (entries.length === 0) {
        if (!document.getElementById("empty-state")) {
            const p = document.createElement("p");
            p.id = "empty-state";
            p.textContent = data.filename
                ? "Session file is empty so far."
                : "No session transcript yet.";
            feed.appendChild(p);
        }
        return;
    }

    // Clear the empty-state placeholder before appending real entries.
    // Unconditional: on the empty→content transition `reset` is false
    // (same file, entries grew), so a reset-gated removal would leave
    // "Session file is empty so far." pinned above the transcript.
    const empty = document.getElementById("empty-state");
    if (empty) empty.remove();

    if (entries.length === renderedCount) return;  // nothing new

    // Measure BEFORE prepending. If the reader is at the top (or this is
    // a fresh session) keep them pinned to the newest line; otherwise
    // grow the scroll offset by the inserted height so the lines they
    // are reading don't jump.
    const atTop = reset || feed.scrollTop < 80;
    const prevHeight = feed.scrollHeight;

    // The file is oldest-first; walk the new tail backwards so the
    // newest line lands first in the fragment, then put the whole
    // fragment above everything already shown.
    const frag = document.createDocumentFragment();
    for (let i = entries.length - 1; i >= renderedCount; i--) {
        frag.appendChild(buildEntry(entries[i]));
    }
    feed.insertBefore(frag, feed.firstChild);
    renderedCount = entries.length;

    if (atTop) feed.scrollTop = 0;
    else feed.scrollTop += feed.scrollHeight - prevHeight;
}

async function poll() {
    try {
        const res = await fetch(DATA_URL);
        if (res.ok) render(await res.json());
    } catch (e) {
        console.error("Live poll error:", e);
    }
}

poll();
setInterval(poll, POLL_MS);
setInterval(tickUpdatedLabel, 1000);

// The ask box (templates/_ask.html + static/ask.js) follows the newest
// session; tell it on every poll whether there is anything to ask about.
function updateAskAvailability(data) {
    if (!window.AskBox) return;
    let reason = "";
    if (data.ask_configured === false) reason = window.AskBox.NO_KEY_REASON;
    else if (!data.filename) reason = "No session transcript yet.";
    else if (!data.entries || data.entries.length === 0) reason = "Nothing transcribed yet.";
    window.AskBox.setAvailability(reason);
    window.AskBox.setSession(data.session && data.session.key);
}
</script>
{% endblock %}
