# Hooks from the Raylytics VC Standard (templates/pre-commit/base.yaml + python.yaml)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-merge-conflict
  - id: check-added-large-files
    args:
    - --maxkb=5120
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - --strict
    - feat
    - fix
    - perf
    - refactor
    - style
    - docs
    - test
    - build
    - ci
    - chore
    - revert
- repo: local
  hooks:
  - id: no-ai-bylines
    name: refuse AI bylines
    entry: 'Co-Authored-By: (Claude|Copilot|Cursor)|noreply@anthropic\.com|Generated with \[?Claude'
    language: pygrep
    stages:
    - commit-msg
  - id: subject-72
    name: subject line at most 72 characters
    entry: \A[^\n]{73,}
    language: pygrep
    args:
    - --multiline
    stages:
    - commit-msg
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
  - id: ruff-format
