{% extends "base.html" %}
{% block title %}Live Session - Transcript Bot{% endblock %}
{% block content %}
<hgroup>
    <h1>Live Session</h1>
    <p id="session-meta">Loading…</p>
</hgroup>

<article>
    <header>
        <span id="live-badge" class="live-badge live-off">idle</span>
        <span id="updated" class="search-meta"></span>
    </header>
    <div id="live-feed" class="transcript-content" aria-live="polite">
        <p id="empty-state">No session transcript yet.</p>
    </div>
</article>
{% endblock %}

{% block scripts %}
<script>
const DATA_URL = "{{ url_for('live_data') }}";
const POLL_MS = 3000;

let lastFetchAt = 0;
let lastAge = null;

function fmtAge(sec) {
    if (sec == null) return "";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + "s ago";
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + "m " + s + "s ago";
}

function tickUpdatedLabel() {
    // Advance the "updated Ns ago" label between polls without refetching.
    if (lastAge == null) return;
    const extra = (Date.now() - lastFetchAt) / 1000;
    document.getElementById("updated").textContent =
        "last write " + fmtAge(lastAge + extra);
}

function render(data) {
    const badge = document.getElementById("live-badge");
    const meta = document.getElementById("session-meta");
    const feed = document.getElementById("live-feed");

    if (data.live) {
        badge.textContent = "● LIVE";
        badge.className = "live-badge live-on";
    } else {
        badge.textContent = "idle";
        badge.className = "live-badge live-off";
    }

    meta.textContent = data.filename
        ? "session: " + data.filename + " · " + data.entries.length + " entries"
        : "No active session.";

    lastAge = data.age_seconds;
    lastFetchAt = Date.now();
    tickUpdatedLabel();

    // Stick to bottom only if the user is already near it, so scrolling
    // back to re-read isn't yanked away on each poll.
    const nearBottom =
        feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;

    // Rebuild via DOM APIs + textContent: transcript text is raw user
    // speech and must never be parsed as HTML.
    while (feed.firstChild) feed.removeChild(feed.firstChild);

    if (!data.entries || data.entries.length === 0) {
        const p = document.createElement("p");
        p.textContent = data.filename
            ? "Session file is empty so far."
            : "No session transcript yet.";
        feed.appendChild(p);
        return;
    }

    for (const e of data.entries) {
        const entry = document.createElement("div");
        entry.className = "entry";

        const head = document.createElement("div");
        head.className = "entry-meta";
        let who = "";
        if (e.player) {
            who = e.player;
            if (e.character && e.character !== e.player) who += " (" + e.character + ")";
        }
        const whoSpan = document.createElement("strong");
        whoSpan.textContent = who || "Unknown";
        head.appendChild(whoSpan);
        if (e.time) head.appendChild(document.createTextNode(" · " + e.time));

        const body = document.createElement("div");
        body.className = "entry-text";
        body.textContent = e.text;

        if (who || e.time) entry.appendChild(head);
        entry.appendChild(body);
        feed.appendChild(entry);
    }

    if (nearBottom) feed.scrollTop = feed.scrollHeight;
}

async function poll() {
    try {
        const res = await fetch(DATA_URL);
        if (res.ok) render(await res.json());
    } catch (e) {
        console.error("Live poll error:", e);
    }
}

poll();
setInterval(poll, POLL_MS);
setInterval(tickUpdatedLabel, 1000);
</script>
{% endblock %}
