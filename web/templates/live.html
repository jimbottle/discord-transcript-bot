{% extends "base.html" %}
{% block title %}Live Session - Transcript Bot{% endblock %}
{% block content %}
<hgroup>
    <h1>Live Session</h1>
    <p id="session-meta">Loading…</p>
</hgroup>

<article>
    <header>
        <span id="live-badge" class="live-badge live-off">idle</span>
        <span id="updated" class="search-meta"></span>
    </header>
    <div id="live-feed" class="transcript-content" aria-live="polite">
        <p id="empty-state">No session transcript yet.</p>
    </div>
</article>

<article id="ask-panel">
    <header>
        <strong>Ask about this session</strong>
        <span id="ask-meta" class="search-meta"></span>
    </header>
    <form id="ask-form" autocomplete="off">
        <textarea id="ask-question" name="question" rows="2"
                  maxlength="2000" required
                  placeholder="e.g. What did the party agree to do next?"></textarea>
        <div class="ask-actions">
            <button type="submit" id="ask-submit">Ask</button>
            <span id="ask-status" class="search-meta" aria-live="polite"></span>
        </div>
    </form>
    <div id="ask-answers" aria-live="polite"></div>
</article>
{% endblock %}

{% block scripts %}
<script>
const DATA_URL = "{{ url_for('live_data') }}";
const ASK_URL = "{{ url_for('ask_session') }}";
const POLL_MS = 3000;

let lastFetchAt = 0;
let lastAge = null;

function fmtAge(sec) {
    if (sec == null) return "";
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + "s ago";
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + "m " + s + "s ago";
}

function tickUpdatedLabel() {
    // Advance the "updated Ns ago" label between polls without refetching.
    if (lastAge == null) return;
    const extra = (Date.now() - lastFetchAt) / 1000;
    document.getElementById("updated").textContent =
        "last write " + fmtAge(lastAge + extra);
}

// How many entries are already in the DOM, and for which session file.
// Newest-first, prepend-only rendering: the latest line is always at the
// top of the feed, and we never tear down existing nodes, so a user who
// scrolled down to re-read keeps their place, text selection is
// preserved, and a screen reader (aria-live) only announces NEW lines —
// not the whole transcript every poll.
let renderedCount = 0;
let renderedFile = null;

function buildEntry(e) {
    // createElement + textContent: transcript text is raw user speech
    // and must never be parsed as HTML.
    const entry = document.createElement("div");
    entry.className = "entry";

    let who = "";
    if (e.player) {
        who = e.player;
        if (e.character && e.character !== e.player) who += " (" + e.character + ")";
    }
    if (who || e.time) {
        const head = document.createElement("div");
        head.className = "entry-meta";
        const whoSpan = document.createElement("strong");
        whoSpan.textContent = who || "Unknown";
        head.appendChild(whoSpan);
        if (e.time) head.appendChild(document.createTextNode(" · " + e.time));
        entry.appendChild(head);
    }

    const body = document.createElement("div");
    body.className = "entry-text";
    body.textContent = e.text;
    entry.appendChild(body);
    return entry;
}

function render(data) {
    const badge = document.getElementById("live-badge");
    const meta = document.getElementById("session-meta");
    const feed = document.getElementById("live-feed");

    if (data.live) {
        badge.textContent = "● LIVE";
        badge.className = "live-badge live-on";
    } else {
        badge.textContent = "idle";
        badge.className = "live-badge live-off";
    }

    meta.textContent = data.filename
        ? "session: " + data.filename + " · " + data.entries.length + " entries"
        : "No active session.";

    lastAge = data.age_seconds;
    lastFetchAt = Date.now();
    tickUpdatedLabel();
    updateAskAvailability(data);

    const entries = data.entries || [];

    // Full reset only when the session changed or the file shrank
    // (new session / rotated / truncated) — otherwise it grows.
    const reset =
        data.filename !== renderedFile || entries.length < renderedCount;
    if (reset) {
        while (feed.firstChild) feed.removeChild(feed.firstChild);
        renderedCount = 0;
        renderedFile = data.filename;
    }

    if (entries.length === 0) {
        if (!document.getElementById("empty-state")) {
            const p = document.createElement("p");
            p.id = "empty-state";
            p.textContent = data.filename
                ? "Session file is empty so far."
                : "No session transcript yet.";
            feed.appendChild(p);
        }
        return;
    }

    // Clear the empty-state placeholder before appending real entries.
    // Unconditional: on the empty→content transition `reset` is false
    // (same file, entries grew), so a reset-gated removal would leave
    // "Session file is empty so far." pinned above the transcript.
    const empty = document.getElementById("empty-state");
    if (empty) empty.remove();

    if (entries.length === renderedCount) return;  // nothing new

    // Measure BEFORE prepending. If the reader is at the top (or this is
    // a fresh session) keep them pinned to the newest line; otherwise
    // grow the scroll offset by the inserted height so the lines they
    // are reading don't jump.
    const atTop = reset || feed.scrollTop < 80;
    const prevHeight = feed.scrollHeight;

    // The file is oldest-first; walk the new tail backwards so the
    // newest line lands first in the fragment, then put the whole
    // fragment above everything already shown.
    const frag = document.createDocumentFragment();
    for (let i = entries.length - 1; i >= renderedCount; i--) {
        frag.appendChild(buildEntry(entries[i]));
    }
    feed.insertBefore(frag, feed.firstChild);
    renderedCount = entries.length;

    if (atTop) feed.scrollTop = 0;
    else feed.scrollTop += feed.scrollHeight - prevHeight;
}

async function poll() {
    try {
        const res = await fetch(DATA_URL);
        if (res.ok) render(await res.json());
    } catch (e) {
        console.error("Live poll error:", e);
    }
}

poll();
setInterval(poll, POLL_MS);
setInterval(tickUpdatedLabel, 1000);

// ── Ask about this session ─────────────────────────────────────────────
// One question at a time; answers stack newest-first under the form so a
// long session's Q&A stays readable. Same backend module as Discord's /ask.
const askForm = document.getElementById("ask-form");
const askInput = document.getElementById("ask-question");
const askSubmit = document.getElementById("ask-submit");
const askStatus = document.getElementById("ask-status");
const askMeta = document.getElementById("ask-meta");
const askAnswers = document.getElementById("ask-answers");
let askBusy = false;
let askReady = false;

function updateAskAvailability(data) {
    let reason = "";
    if (data.ask_configured === false) {
        reason = "ANTHROPIC_API_KEY is not set for the dashboard — start it with `make web` (reads op.env).";
    } else if (!data.filename) {
        reason = "No session transcript yet.";
    } else if (!data.entries || data.entries.length === 0) {
        reason = "Nothing transcribed yet.";
    }
    askReady = !reason;
    askMeta.textContent = reason;
    askInput.disabled = !askReady || askBusy;
    askSubmit.disabled = !askReady || askBusy;
}

function addQA(question, result, errorText) {
    // textContent only: the question is user input and the answer is
    // model output; neither may be parsed as HTML.
    const block = document.createElement("div");
    block.className = "qa" + (errorText ? " qa-failed" : "");

    const q = document.createElement("div");
    q.className = "qa-q";
    q.textContent = question;
    block.appendChild(q);

    const a = document.createElement("div");
    a.className = errorText ? "qa-err" : "qa-a";
    a.textContent = errorText || result.answer;
    block.appendChild(a);

    if (result && result.model) {
        const m = document.createElement("div");
        m.className = "qa-meta";
        m.textContent = result.model
            + " · in " + result.input_tokens
            + (result.cached_tokens ? " (" + result.cached_tokens + " cached)" : "")
            + " · out " + result.output_tokens
            + " · " + new Date().toLocaleTimeString();
        block.appendChild(m);
    }
    askAnswers.prepend(block);
}

async function submitAsk(ev) {
    ev.preventDefault();
    const question = askInput.value.trim();
    if (!question || askBusy || !askReady) return;

    askBusy = true;
    askInput.disabled = true;
    askSubmit.disabled = true;
    askSubmit.setAttribute("aria-busy", "true");
    askStatus.textContent = "Asking…";
    const started = Date.now();

    try {
        const res = await fetch(ASK_URL, {
            method: "POST",
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ question: question }),
        });
        let body = null;
        try { body = await res.json(); } catch (e) { body = null; }
        if (res.ok && body && body.answer) {
            addQA(question, body, null);
            askInput.value = "";
            askStatus.textContent = "Answered in " + Math.round((Date.now() - started) / 1000) + "s";
        } else {
            const msg = (body && body.error) ? body.error : ("Request failed (" + res.status + ")");
            addQA(question, null, msg);
            askStatus.textContent = "";
        }
    } catch (e) {
        addQA(question, null, "Couldn't reach the dashboard: " + e);
        askStatus.textContent = "";
    } finally {
        askBusy = false;
        askSubmit.removeAttribute("aria-busy");
        askInput.disabled = !askReady;
        askSubmit.disabled = !askReady;
        if (askReady) askInput.focus();
    }
}

askForm.addEventListener("submit", submitAsk);
// Cmd/Ctrl+Enter submits from inside the textarea; plain Enter stays a newline.
askInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submitAsk(e);
});
</script>
{% endblock %}
